<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Research Gallery of YuHang Zhao: videos and posters organized by project and work.">
  <title>Research Gallery | YuHang Zhao</title>
  <link rel="stylesheet" href="assets/style.css?v=gallery-4">
  <script src="assets/catalog.js?v=gallery-3" defer></script>
  <script src="assets/app.js?v=gallery-4" defer></script>
</head>
<body>
  <header>
    <div class="library-brand">
      <h1>Research Gallery <span class="brand-of">of</span></h1>
      <a class="wordmark" href="https://yuhang-yohoo.github.io/" aria-label="宇航-Yohoo — YuHang Zhao's personal website">
        <span class="brand-name"><span class="brand-cjk" lang="zh-Hans">宇航</span><span class="brand-separator">-</span><span class="brand-latin">Yohoo</span></span>
      </a>
    </div>
    <img class="brand-logo" src="assets/daedalus-logo.png" alt="Daedalus Research Center" width="727" height="187">
  </header>
  <main>
    <aside aria-label="Research gallery">
      <label for="group">Project</label><select id="group"><option value="">All projects</option></select>
      <label for="work">Work</label><select id="work"><option value="">All works</option></select>
      <p id="count" class="muted" aria-live="polite"></p>
      <div id="list"></div>
    </aside>
    <section aria-label="Selected gallery item">
      <video id="player" controls playsinline preload="metadata" aria-label="Selected research video" hidden></video>
      <img id="poster" alt="" hidden>
      <iframe id="poster-pdf" title="Selected research poster" hidden></iframe>
      <p id="project" class="eyebrow"></p><h2 id="title">Loading gallery…</h2><p id="item-type" class="item-type"></p><p id="description"></p>
      <div id="actions" hidden><a id="download" download>Download item</a><button id="share" type="button">Copy link</button></div>
      <p id="status" role="status"></p>
    </section>
  </main>
  <footer>
    <a href="https://github.com/Yuhang-Yohoo/Supplementary-Videos">View repository on GitHub</a>
    <div class="site-qr">
      <a href="https://yuhang-yohoo.github.io/Supplementary-Videos/" aria-label="Open the research gallery">
        <img src="assets/site-qr.svg" width="144" height="144" alt="QR code for the Research Gallery website">
      </a>
      <div><p>Scan to open on your phone</p><a href="assets/site-qr.svg" download="supplementary-videos-qr.svg">Download QR code</a></div>
    </div>
  </footer>
</body>
</html>
